# Codespace / proxy settings: permite que o app use os headers do proxy remoto
# e escute em todas as interfaces para expor o app ao Codespace.
server:
    address: 0.0.0.0
    use-forward-headers: true
    forward-headers-strategy: framework

spring:
    application:
        name: project
    
    datasource:
        url: jdbc:h2:mem:products
        username: sa
        password: password
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
    h2:
        console:
            enabled: true
            path: /h2-console
            settings:
                # Permite conexões remotas ao console H2 via proxy do Codespace.
                web-allow-others: true